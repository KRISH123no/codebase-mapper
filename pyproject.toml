[project]
name = "codebase-mapper"
version = "0.1.0"
description = "What is load-bearing in this codebase, and what is untested"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krish Saxena" }]
keywords = ["static-analysis", "architecture", "dependency-graph", "code-quality", "onboarding"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]
# None. ast, xml and git are all you need.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "coverage>=7"]

[project.scripts]
codebase-mapper = "codebase_mapper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codebase_mapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E731"]
