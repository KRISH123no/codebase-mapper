  <text xml:space="preserve"><tspan x="22.0" y="44.0" fill="#c8d0da" font-weight="600">/private/tmp/claude-501/-Users-apple-Desktop-Submission/a9cbde98-3f2f-4bcb-8303-d93bfc64bb0b/scratchpad/requests</tspan><tspan x="22.0" y="63.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="63.0" fill="#6b7684">22&#160;modules&#160;·&#160;depth&#160;10&#160;·&#160;1&#160;cycle&#160;·&#160;no&#160;coverage&#160;report&#160;·&#160;1980&#160;commits&#160;read</tspan><tspan x="22.0" y="101.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="101.0" fill="#ff5f5f">!!</tspan><tspan x="55.8" y="101.0" fill="#c8d0da">&#160;</tspan><tspan x="64.2" y="101.0" fill="#c8d0da" font-weight="600">src.requests._types&#160;→&#160;src.requests.adapters&#160;→&#160;src.requests.auth&#160;→&#160;src.requests.cookies&#160;→&#160;…</tspan><tspan x="22.0" y="120.0" fill="#c8d0da">&#160;&#160;&#160;&#160;&#160;8&#160;modules&#160;depend&#160;on&#160;each&#160;other</tspan><tspan x="22.0" y="139.0" fill="#c8d0da">&#160;&#160;&#160;&#160;&#160;</tspan><tspan x="64.2" y="139.0" fill="#ff5f5f">→&#160;Cut&#160;src.requests.adapters&#160;→&#160;src.requests.auth&#160;first;&#160;it&#160;is&#160;the&#160;most&#160;unstable&#160;end,&#160;so&#160;inverting&#160;it&#160;is&#160;cheapest.</tspan><tspan x="22.0" y="177.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="177.0" fill="#ff5f5f">!!</tspan><tspan x="55.8" y="177.0" fill="#c8d0da">&#160;</tspan><tspan x="64.2" y="177.0" fill="#c8d0da" font-weight="600">src.requests.compat</tspan><tspan x="22.0" y="196.0" fill="#c8d0da">&#160;&#160;&#160;&#160;&#160;stable&#160;and&#160;concrete&#160;·&#160;I=0.00&#160;A=0.00&#160;·&#160;10&#160;depend&#160;on&#160;it</tspan><tspan x="22.0" y="215.0" fill="#c8d0da">&#160;&#160;&#160;&#160;&#160;</tspan><tspan x="64.2" y="215.0" fill="#ff5f5f">→&#160;If&#160;it&#160;keeps&#160;changing,&#160;put&#160;an&#160;interface&#160;in&#160;front&#160;of&#160;it.</tspan><tspan x="22.0" y="253.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="253.0" fill="#ffaf00">!&#160;</tspan><tspan x="55.8" y="253.0" fill="#c8d0da">&#160;</tspan><tspan x="64.2" y="253.0" fill="#c8d0da" font-weight="600">src.requests.sessions</tspan><tspan x="22.0" y="272.0" fill="#c8d0da">&#160;&#160;&#160;&#160;&#160;depends&#160;on&#160;12&#160;modules</tspan><tspan x="22.0" y="291.0" fill="#c8d0da">&#160;&#160;&#160;&#160;&#160;</tspan><tspan x="64.2" y="291.0" fill="#ffaf00">→&#160;Worth&#160;a&#160;look&#160;—&#160;this&#160;is&#160;a&#160;proxy,&#160;not&#160;a&#160;verdict.</tspan><tspan x="22.0" y="329.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="329.0" fill="#ffaf00">!&#160;</tspan><tspan x="55.8" y="329.0" fill="#c8d0da">&#160;</tspan><tspan x="64.2" y="329.0" fill="#c8d0da" font-weight="600">src.requests.models</tspan><tspan x="22.0" y="348.0" fill="#c8d0da">&#160;&#160;&#160;&#160;&#160;depends&#160;on&#160;11&#160;modules</tspan><tspan x="22.0" y="367.0" fill="#c8d0da">&#160;&#160;&#160;&#160;&#160;</tspan><tspan x="64.2" y="367.0" fill="#ffaf00">→&#160;Worth&#160;a&#160;look&#160;—&#160;this&#160;is&#160;a&#160;proxy,&#160;not&#160;a&#160;verdict.</tspan><tspan x="22.0" y="405.0" fill="#c8d0da">&#160;&#160;</tspan><tspan x="38.9" y="405.0" fill="#6b7684">13&#160;more&#160;—&#160;pass&#160;--all</tspan><tspan x="22.0" y="424.0" fill="#6b7684">&#160;&#160;no&#160;coverage&#160;report&#160;found&#160;—&#160;run&#160;`coverage&#160;run&#160;-m&#160;pytest&#160;&amp;&amp;&#160;coverage&#160;xml`&#160;and&#160;the&#160;strongest&#160;finding&#160;becomes&#160;available</tspan></text>
